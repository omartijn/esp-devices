esphome:
  name: esphome-boiler-controller
  friendly_name: Boiler Controller
  min_version: 2025.12.2
  name_add_mac_suffix: false

esp32:
  board: lolin_s2_mini
  variant: esp32s2
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Simple web-server for debugging
web_server:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

one_wire:
  - platform: gpio
    pin: GPIO7

sensor: 
  - platform: dallas_temp
    name: boiler_temp
    update_interval: 120s

switch:
  - platform: gpio
    pin: GPIO17
    name: boiler_power
