esphome:
  name: esphome-web-fb87ec
  friendly_name: Door Lock
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

switch:
  - platform: gpio
    id: door_unlock
    name: "Door unlock"
    pin: GPIO18
  - platform: gpio
    id: doorbell
    name: "Door bell"
    pin: GPIO5

script:
  - id: unlock_door
    mode: single
    then:
      - switch.turn_on: door_unlock
      - delay: 5s
      - switch.turn_off: door_unlock
  - id: ring_bell
    mode: single
    then:
      - switch.turn_on: doorbell
      - delay: 0.5s
      - switch.turn_off: doorbell

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
